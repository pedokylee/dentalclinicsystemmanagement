<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1600" viewBox="0 0 2200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Dental Clinic Management System - Entity Relationship Diagram</title>
  <desc id="desc">ERD showing key tables, primary keys, foreign keys, and cardinality relationships for the dental clinic management system.</desc>
  <defs>
    <style>
      .bg { fill: #f8fbfd; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .table { fill: #ffffff; stroke: #0f766e; stroke-width: 2; rx: 12; ry: 12; }
      .head { fill: #e6fffb; stroke: #0f766e; stroke-width: 2; rx: 12; ry: 12; }
      .name { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .field { font: 13px 'Consolas', 'Courier New', monospace; fill: #1f2937; }
      .pk { fill: #0f766e; font-weight: 700; }
      .fk { fill: #2563eb; font-weight: 700; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; }
      .card { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

